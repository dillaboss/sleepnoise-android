<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Sleep Noise</title>
<style>
  :root{
    --bg:#000; --ink:#f3e6d6; --dim:#8a7a69; --faint:#3a3129; --line:#241d17;
    --amber:#e0a35c; --amber-deep:#9b6531; --ember:#5a3618; --panel:#0e0b09; --ok:#9fc28a; --warn:#e07c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- main screen ---------- */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));transition:opacity 1.2s ease}
  #top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
  #pill{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--dim);padding:10px 14px;border:1px solid var(--line);border-radius:999px;min-height:44px;max-width:78%}
  #pill .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  #pill.ready .dot{background:var(--ok)} #pill.busy .dot{background:var(--amber);animation:blink 1.2s infinite} #pill.err .dot{background:var(--warn)}
  #pill.listen{color:var(--ink);border-color:var(--amber-deep)} #pill.listen .dot{background:var(--amber);box-shadow:0 0 12px var(--amber)}
  #pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes blink{50%{opacity:.25}}
  #gear{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim)}
  #gear svg{width:26px;height:26px}

  #center{display:flex;flex-direction:column;align-items:center;gap:26px}
  #big{position:relative;width:min(80vw,62vh);height:min(80vw,62vh);border-radius:50%;
       background:radial-gradient(circle at 50% 38%,#2a1b0f 0%,#140d07 55%,#0a0604 100%);
       box-shadow:inset 0 0 0 2px #2b1d12, 0 0 0 1px #000, 0 30px 80px -30px #000;
       display:grid;place-items:center;transition:transform .15s ease, box-shadow .6s ease}
  #big:active{transform:scale(.97)}
  #big.on{box-shadow:inset 0 0 0 2px var(--amber-deep), 0 0 90px -20px rgba(224,163,92,.35)}
  #big.listen{box-shadow:inset 0 0 0 3px var(--amber), 0 0 120px -10px rgba(224,163,92,.6)}
  #big svg{width:34%;height:34%;fill:var(--amber)}
  #big .ring{position:absolute;inset:-14px;border-radius:50%;border:1px solid transparent}
  #big.on .ring{border-color:rgba(224,163,92,.18);animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.985);opacity:.4}50%{transform:scale(1.02);opacity:1}}
  #label{font-size:20px;letter-spacing:.04em;color:var(--dim);text-align:center;min-height:28px}
  #label b{color:var(--ink);font-weight:500}

  #vol{display:flex;align-items:center;gap:22px}
  #vol button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);font-size:36px;line-height:1;color:var(--dim);display:grid;place-items:center}
  #vol button:active{background:#120c07}
  #volnum{min-width:90px;text-align:center;font-size:22px;color:var(--dim);font-variant-numeric:tabular-nums}

  #toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:#1a120b;border:1px solid var(--amber-deep);color:var(--ink);padding:14px 22px;border-radius:14px;font-size:19px;opacity:0;pointer-events:none;transition:all .35s ease;z-index:30}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  body.night #toast{background:#0a0705;border-color:#2b1d12;color:#7a634c}

  /* ---------- night display (anti burn-in) ---------- */
  #night{position:fixed;inset:0;display:none;z-index:20}
  #nightinfo{position:absolute;color:#4a3a2b;font-size:15px;text-align:center;line-height:1.5;transition:left 2s ease, top 2s ease;opacity:.55}
  #nightinfo .clock{font-size:34px;font-weight:300;letter-spacing:.05em;font-variant-numeric:tabular-nums}
  body.night #app{opacity:0;pointer-events:none}
  body.night #night{display:block}
  body.night.listen #nightinfo{color:var(--amber);opacity:1}

  /* ---------- start overlay ---------- */
  #start{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px}
  #start h1{font-weight:300;font-size:30px;margin:0;color:var(--ink)}
  #start p{color:var(--dim);margin:0;font-size:17px;max-width:30ch;line-height:1.5}
  #start .tap{margin-top:12px;width:160px;height:160px;border-radius:50%;border:2px solid var(--amber-deep);display:grid;place-items:center;color:var(--amber);font-size:20px;animation:breathe 4s ease-in-out infinite}

  /* ---------- settings ---------- */
  #sheet{position:fixed;inset:0;z-index:40;background:var(--panel);transform:translateY(100%);transition:transform .35s ease;display:flex;flex-direction:column}
  #sheet.open{transform:none}
  #sheethead{display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  #sheethead h2{margin:0;font-weight:400;font-size:22px}
  #close{height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--amber-deep);color:var(--amber);font-size:17px}
  #form{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 60px;flex:1}
  .sec{margin:26px 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
  .row{padding:14px 0;border-bottom:1px solid var(--line)}
  .row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .row .name{font-size:17px}
  .row .val{font-size:15px;color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
  .row .hint{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.45}
  .row .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--amber-deep) var(--p,50%),var(--faint) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--amber);margin-top:-12px;border:3px solid #1a120b}
  .toggle{display:flex;justify-content:space-between;align-items:center;gap:14px}
  .sw{position:relative;width:58px;height:34px;border-radius:17px;background:var(--faint);flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#bba58f;transition:transform .2s}
  .sw.on{background:var(--amber-deep)} .sw.on::after{transform:translateX(24px);background:var(--ink)}
  .btn{height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--faint);color:var(--ink);font-size:16px}
  .btn.warn{border-color:#5a2b1c;color:var(--warn)}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  select,input[type=text],input[type=time]{width:100%;height:48px;background:#16110c;color:var(--ink);border:1px solid var(--faint);border-radius:10px;padding:0 12px;font:inherit;font-size:17px;user-select:text;-webkit-user-select:text}
  .two{display:flex;gap:10px;align-items:center}
  .two > *{flex:1}
  .heard{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink);background:#16110c;border-radius:8px;padding:10px 12px;min-height:40px;user-select:text}
  .meter{height:8px;border-radius:4px;background:var(--faint);overflow:hidden;margin-top:10px}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
  .cmds{font-size:14px;color:var(--dim);line-height:1.7}
  .cmds b{color:var(--ink);font-weight:500}
</style>
</head>
<body>

<div id="start">
  <h1>Sleep Noise</h1>
  <p>Tap once to start the sound engine and allow the microphone for voice control.</p>
  <button class="tap" id="startbtn">Begin</button>
</div>

<div id="app">
  <div id="top">
    <div id="pill"><i class="dot"></i><span id="pilltext">Voice starting…</span></div>
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>

  <div id="center">
    <button id="big" aria-label="Play or pause"><i class="ring"></i><svg id="icon" viewBox="0 0 100 100"></svg></button>
    <div id="label">Paused</div>
  </div>

  <div id="vol">
    <button id="vdown" aria-label="Quieter">−</button>
    <div id="volnum">70%</div>
    <button id="vup" aria-label="Louder">+</button>
  </div>
</div>

<div id="night"><div id="nightinfo"><div class="clock" id="nclock"></div><div id="nstate"></div></div></div>
<div id="toast"></div>

<div id="sheet">
  <div id="sheethead"><h2>Settings</h2><button id="close">Done</button></div>
  <div id="form"></div>
</div>

<script>
"use strict";
/* ======================= settings ======================= */
const DEFAULTS = {
  volume: 0.7, tone: 900, rumble: 45, color: 0, width: 0.6, waves: 0, wavePeriod: 12, fadeIn: 8, fadeOut: 4,
  introOn: true, introVol: 0.8, noiseDelay: 3.5,
  voiceOn: true, wake: "hey brownie", chime: true, chimeVol: 0.25, duck: 0.3, minConf: 0.6, micFx: false, micGain: 1,
  autoStart: "", autoStop: "",
  dimAfter: 20, showClock: true, resume: true
};
const KEY = "sleepnoise.v1";
const NATIVE = typeof window.SleepNoiseNative !== "undefined";
const APPMODE = NATIVE || /[?&]app=1/.test(location.search);
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const COMMANDS = [
  { id: "start",   phrases: ["start", "play", "resume", "good night", "goodnight"], say: "Playing" },
  { id: "stop",    phrases: ["stop", "pause", "good morning"], say: "Paused" },
  { id: "louder",  phrases: ["louder", "volume up"], say: "Louder" },
  { id: "quieter", phrases: ["quieter", "softer", "volume down"], say: "Quieter" },
  { id: "deeper",  phrases: ["deeper"], say: "Deeper" },
  { id: "brighter",phrases: ["brighter"], say: "Brighter" },
];
const WAKE_PRESETS = ["hey brownie", "okay brownie", "hey sleepy", "hey noise", "computer"];

/* ======================= tiny helpers ======================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function b64ToBytes(b64) {
  b64 = b64.replace(/\s+/g, "");
  const pad = b64.endsWith("==") ? 2 : b64.endsWith("=") ? 1 : 0;
  const out = new Uint8Array(b64.length / 4 * 3 - pad);
  const CH = 1 << 20; let o = 0;                       // decode in 1 MB chunks (multiple of 4)
  for (let i = 0; i < b64.length; i += CH) {
    const s = atob(b64.slice(i, i + CH));
    for (let j = 0; j < s.length; j++) out[o++] = s.charCodeAt(j);
  }
  return out;
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }

/* ======================= audio engine ======================= */
const WORKLET = `
const A = 1 - 2 * Math.PI * 20 / sampleRate;                // integrator corner ~20 Hz
const BN = 0.25 / Math.sqrt((1 - A) / (1 + A) / 3);         // normalise brown to ~0.25 RMS
const PK = 0.141;                                           // normalise pink to ~0.25 RMS
function mk(seed) { return { x: (Math.imul(seed, 2654435761) >>> 0) || 1, b: 0, p: new Float64Array(7) }; }
function step(s, c) {
  let x = s.x; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; s.x = x >>> 0;
  const w = s.x / 2147483648 - 1;
  s.b = A * s.b + (1 - A) * w;
  const brown = s.b * BN;
  if (c <= 0) return brown;
  const p = s.p;
  p[0] = 0.99886 * p[0] + w * 0.0555179; p[1] = 0.99332 * p[1] + w * 0.0750759; p[2] = 0.96900 * p[2] + w * 0.1538520;
  p[3] = 0.86650 * p[3] + w * 0.3104856; p[4] = 0.55000 * p[4] + w * 0.5329522; p[5] = -0.7616 * p[5] - w * 0.0168980;
  const pink = (p[0] + p[1] + p[2] + p[3] + p[4] + p[5] + p[6] + w * 0.5362) * PK; p[6] = w * 0.115926;
  return brown * (1 - c) + pink * c;
}
class BrownNoise extends AudioWorkletProcessor {
  constructor() { super(); this.color = 0; this.width = 0.6; this.s = [mk(7), mk(1913), mk(50021)];
    this.port.onmessage = e => Object.assign(this, e.data); }
  process(_, outs) {
    const o = outs[0], L = o[0], R = o[1] || o[0], n = L.length, c = this.color;
    const gm = Math.sqrt(1 - this.width), gs = Math.sqrt(this.width);
    for (let i = 0; i < n; i++) {
      const m = step(this.s[0], c), l = step(this.s[1], c), r = step(this.s[2], c);
      L[i] = gm * m + gs * l; R[i] = gm * m + gs * r;
    }
    return true;
  }
}
registerProcessor("brown-noise", BrownNoise);`;

let ctx, noise, hpf, lpf, waveGain, lfo, lfoGain, fade, duckG, master, makeup, limiter, introGain, chimeOut, jingleBuf;
let playing = false, introSrc = null, engineKind = "";

async function makeNoiseNode() {
  try {
    let ok = false;
    for (const url of [URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })), "data:application/javascript;base64," + btoa(WORKLET)]) {
      try { await ctx.audioWorklet.addModule(url); ok = true; break; } catch (e) { console.warn("worklet load failed for", url.slice(0, 30), e); }
    }
    if (!ok) throw new Error("no worklet");
    engineKind = "worklet";
    return new AudioWorkletNode(ctx, "brown-noise", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  } catch (e) {
    // Fallback: same generator on the main thread
    console.warn("AudioWorklet unavailable, using ScriptProcessor", e);
    engineKind = "script";
    const sampleRate = ctx.sampleRate;
    const mod = {}; new Function("sampleRate", "registerProcessor", "AudioWorkletProcessor", WORKLET + "\nthis.step=step;this.mk=mk;").call(mod, sampleRate, () => {}, class {});
    const st = [mod.mk(7), mod.mk(1913), mod.mk(50021)];
    const node = ctx.createScriptProcessor(4096, 0, 2);
    node.cfg = { color: 0, width: 0.6 };
    node.port = { postMessage: d => Object.assign(node.cfg, d) };
    node.onaudioprocess = ev => {
      const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1), c = node.cfg.color;
      const gm = Math.sqrt(1 - node.cfg.width), gs = Math.sqrt(node.cfg.width);
      for (let i = 0; i < L.length; i++) { const m = mod.step(st[0], c), l = mod.step(st[1], c), r = mod.step(st[2], c); L[i] = gm * m + gs * l; R[i] = gm * m + gs * r; }
    };
    return node;
  }
}

async function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "playback" });
  noise = await makeNoiseNode();
  hpf = ctx.createBiquadFilter(); hpf.type = "highpass"; hpf.Q.value = 0.707;
  lpf = ctx.createBiquadFilter(); lpf.type = "lowpass";  lpf.Q.value = 0.707;
  waveGain = ctx.createGain();
  lfo = ctx.createOscillator(); lfo.type = "sine"; lfoGain = ctx.createGain(); lfo.connect(lfoGain).connect(waveGain.gain); lfo.start();
  fade = ctx.createGain(); fade.gain.value = 0;
  duckG = ctx.createGain();
  makeup = ctx.createGain(); makeup.gain.value = 1.6;
  master = ctx.createGain();
  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -4; limiter.knee.value = 4; limiter.ratio.value = 20; limiter.attack.value = 0.003; limiter.release.value = 0.25;
  noise.connect(hpf).connect(lpf).connect(waveGain).connect(fade).connect(makeup).connect(duckG).connect(master).connect(limiter).connect(ctx.destination);
  introGain = ctx.createGain(); introGain.connect(duckG);
  chimeOut = ctx.createGain(); chimeOut.connect(limiter);
  try { jingleBuf = await ctx.decodeAudioData(b64ToBytes($("jingle").textContent).buffer); } catch (e) { console.warn("jingle decode failed", e); }
  applySound(true);
  ctx.onstatechange = () => { if (ctx.state !== "running") ctx.resume().catch(() => {}); };
}

function applySound(instant) {
  if (!ctx) return;
  const t = ctx.currentTime, k = instant ? 0.001 : 0.08;
  master.gain.setTargetAtTime(S.volume * S.volume, t, k);           // squared = perceptual taper
  lpf.frequency.setTargetAtTime(S.tone, t, k);
  hpf.frequency.setTargetAtTime(S.rumble, t, k);
  waveGain.gain.setTargetAtTime(1 - S.waves / 2, t, k);
  lfoGain.gain.setTargetAtTime(S.waves / 2, t, k);
  lfo.frequency.setTargetAtTime(1 / S.wavePeriod, t, k);
  noise.port.postMessage({ color: S.color, width: S.width });
}

function hold(param, t) { if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t); else { const v = param.value; param.cancelScheduledValues(t); param.setValueAtTime(v, t); } }

function play(source, opts) {
  if (!ctx) return;
  ctx.resume();
  if (playing) return;
  playing = true; S._wasPlaying = true; save();
  const now = ctx.currentTime + 0.03;
  hold(fade.gain, now);
  let noiseAt = now;
  if (S.introOn && jingleBuf && !(opts && opts.noIntro)) {
    stopIntro(0);
    introSrc = ctx.createBufferSource(); introSrc.buffer = jingleBuf;
    hold(introGain.gain, now); introGain.gain.setValueAtTime(S.introVol, now);
    introSrc.connect(introGain); introSrc.start(now);
    const src = introSrc; introSrc.onended = () => { if (introSrc === src) introSrc = null; };
    fade.gain.setTargetAtTime(0, now, 0.15);                          // if it was mid-fade, tuck it away for the jingle
    noiseAt = now + Math.max(0.3, S.noiseDelay);
  }
  fade.gain.setTargetAtTime(1, noiseAt, Math.max(0.05, S.fadeIn / 3));
  render(); if (source) toast("▶  Playing");
}
function stopIntro(rel) {
  if (!introSrc) return;
  const t = ctx.currentTime; hold(introGain.gain, t); introGain.gain.setTargetAtTime(0, t, rel || 0.01);
  try { introSrc.stop(t + (rel ? rel * 5 : 0.05)); } catch (e) {}
  introSrc = null;
}
function pause(source) {
  if (!ctx || !playing) return;
  playing = false; S._wasPlaying = false; save();
  const t = ctx.currentTime;
  stopIntro(Math.max(0.05, S.fadeOut / 4));
  hold(fade.gain, t); fade.gain.setTargetAtTime(0, t, Math.max(0.03, S.fadeOut / 3));
  render(); if (source) toast("❚❚  Paused");
}
function toggle() { playing ? pause("tap") : play("tap"); }
function nudgeVolume(d) { S.volume = clamp(Math.round((S.volume + d) * 100) / 100, 0, 1); applySound(); save(); render(); syncForm(); }

function chime(kind) {
  if (!ctx || !S.chime) return;
  const t = ctx.currentTime + 0.02, notes = kind === "up" ? [659.3, 987.8] : [987.8, 659.3];
  notes.forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
    const s = t + i * 0.13; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(S.chimeVol * 0.5, s + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
    o.connect(g).connect(chimeOut); o.start(s); o.stop(s + 0.55);
  });
}
function previewJingle() {
  if (!ctx || !jingleBuf) return;
  const s = ctx.createBufferSource(); s.buffer = jingleBuf; const g = ctx.createGain(); g.gain.value = S.introVol * S.volume * S.volume;
  s.connect(g).connect(limiter); s.start();
}

/* ======================= voice control ======================= */
let model = null, rec = null, mic = null, micNodes = null, voiceState = "off", windowOpen = false, windowT = null, softDuck = false, softT = null, lastHeard = "", micLevel = 0;

function setPill(state, text) {
  const p = $("pill"); p.className = state; $("pilltext").textContent = text;
  voiceState = state;
}
function wakeTokens() { return S.wake.toLowerCase().trim().split(/\s+/).filter(Boolean); }
function grammar() {
  const g = new Set([S.wake.toLowerCase().trim()]);
  COMMANDS.forEach(c => c.phrases.forEach(p => g.add(p)));
  return [...g, "[unk]"];
}
function idleVoicePill() {
  if (!S.voiceOn) return setPill("", "Voice off");
  if (model && mic) setPill("ready", `Say “${S.wake}”`);
}

async function initVoice() {
  if (!S.voiceOn || model) { idleVoicePill(); return; }
  try {
    setPill("busy", "Loading voice model…");
    const el = $("model");
    if (!el) throw new Error("model missing");
    await new Promise(r => setTimeout(r, 50));
    window.__voskModelBytes = b64ToBytes(el.textContent); el.remove();   // handed straight to the recogniser's worker
    model = await Vosk.createModel("data:,embedded-model", -2);
    await startMic();
    buildRecognizer();
    idleVoicePill();
  } catch (e) {
    console.error(e);
    setPill("err", /Permission|NotAllowed/i.test(String(e && (e.name || e))) ? "Microphone blocked" : "Voice unavailable");
  }
}
async function startMic() {
  if (mic) { mic.getTracks().forEach(t => t.stop()); }
  mic = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: S.micFx, noiseSuppression: S.micFx, autoGainControl: S.micFx, channelCount: 1 } });
  if (micNodes) { try { micNodes.src.disconnect(); } catch (e) {} }
  const src = ctx.createMediaStreamSource(mic);
  const pre = ctx.createGain(); pre.gain.value = S.micGain;
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 220; hp.Q.value = 0.707;   // brown noise lives below here; speech doesn't
  const hp2 = ctx.createBiquadFilter(); hp2.type = "highpass"; hp2.frequency.value = 220; hp2.Q.value = 0.707;
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const sink = ctx.createGain(); sink.gain.value = 0;
  proc.onaudioprocess = ev => {
    const d = ev.inputBuffer.getChannelData(0); let s = 0; for (let i = 0; i < d.length; i += 8) s += d[i] * d[i];
    micLevel = Math.sqrt(s / (d.length / 8));
    if (rec) { try { rec.acceptWaveform(ev.inputBuffer); } catch (e) {} }
  };
  src.connect(pre).connect(hp).connect(hp2).connect(proc).connect(sink).connect(ctx.destination);
  micNodes = { src, pre, proc };
  mic.getAudioTracks()[0].onended = () => { setPill("err", "Microphone stopped"); setTimeout(() => startMic().then(idleVoicePill).catch(() => {}), 3000); };
}
function buildRecognizer() {
  if (!model) return;
  if (rec) { try { rec.remove(); } catch (e) {} }
  rec = new model.KaldiRecognizer(ctx.sampleRate, JSON.stringify(grammar()));
  rec.setWords(true);
  rec.on("partialresult", m => onPartial(m.result.partial || ""));
  rec.on("result", m => onResult(m.result || {}));
}
function stopVoice() {
  if (rec) { try { rec.remove(); } catch (e) {} rec = null; }
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
  if (micNodes) { try { micNodes.src.disconnect(); } catch (e) {} micNodes = null; }
  idleVoicePill();
}

function duck(on) {
  if (!ctx) return;
  const t = ctx.currentTime; hold(duckG.gain, t);
  duckG.gain.setTargetAtTime(on ? S.duck : 1, t, on ? 0.06 : 0.4);
}
function onPartial(p) {
  // Duck early as soon as the wake phrase shows up, so the command is easier to hear. Decisions wait for the final result.
  if (!windowOpen && !softDuck && (" " + p + " ").includes(" " + wakeTokens().join(" ") + " ")) {
    softDuck = true; duck(true); clearTimeout(softT); softT = setTimeout(() => { if (!windowOpen) { softDuck = false; duck(false); } }, 4000);
  }
}
function findCommand(words) {
  const text = " " + words.join(" ") + " ";
  for (const c of COMMANDS) for (const p of c.phrases) if (text.includes(" " + p + " ")) return c;
  return null;
}
function onResult(r) {
  const text = (r.text || "").trim();
  const words = (r.result || []).map(w => ({ w: w.word, c: w.conf }));
  if (text && text !== "[unk]") { lastHeard = text + "  (" + words.map(x => x.w + " " + Math.round(x.c * 100) + "%").join(", ") + ")"; const h = $("heard"); if (h) h.textContent = lastHeard; }
  const wt = wakeTokens();
  let wakeAt = -1;
  for (let i = 0; i + wt.length <= words.length; i++) {
    let ok = true, conf = 0;
    for (let j = 0; j < wt.length; j++) { if (words[i + j].w !== wt[j]) { ok = false; break; } conf += words[i + j].c; }
    if (ok && conf / wt.length >= S.minConf) { wakeAt = i; break; }
  }
  if (wakeAt >= 0) {
    const cmd = findCommand(words.slice(wakeAt + wt.length).map(x => x.w));
    if (cmd) { run(cmd); closeWindow(); }
    else openWindow();
    return;
  }
  if (windowOpen) {
    const cmd = findCommand(words.map(x => x.w));
    if (cmd) { run(cmd); closeWindow(); }
    return;
  }
  if (softDuck) { softDuck = false; clearTimeout(softT); duck(false); }
}
function openWindow() {
  windowOpen = true; softDuck = false; clearTimeout(softT);
  duck(true); chime("up");
  document.body.classList.add("listen"); $("big").classList.add("listen");
  setPill("listen", "Listening…");
  $("nstate").textContent = "Listening…";
  clearTimeout(windowT); windowT = setTimeout(closeWindow, 7000);
}
function closeWindow() {
  windowOpen = false; clearTimeout(windowT);
  duck(false);
  document.body.classList.remove("listen"); $("big").classList.remove("listen");
  idleVoicePill(); render();
}
function run(cmd) {
  switch (cmd.id) {
    case "start": play(); break;
    case "stop": pause(); break;
    case "louder": nudgeVolume(+0.08); break;
    case "quieter": nudgeVolume(-0.08); break;
    case "deeper": S.tone = clamp(Math.round(S.tone * 0.8), 150, 4000); applySound(); save(); syncForm(); break;
    case "brighter": S.tone = clamp(Math.round(S.tone * 1.25), 150, 4000); applySound(); save(); syncForm(); break;
  }
  toast(cmd.say);
}

/* ======================= UI ======================= */
const ICON_PLAY = '<path d="M30 18 L84 50 L30 82 Z"/>';
const ICON_PAUSE = '<rect x="24" y="18" width="18" height="64" rx="4"/><rect x="58" y="18" width="18" height="64" rx="4"/>';
function render() {
  $("icon").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("big").classList.toggle("on", playing);
  $("label").innerHTML = playing ? "<b>Brown noise</b> · playing" : "Paused";
  $("volnum").textContent = Math.round(S.volume * 100) + "%";
  if (!windowOpen) $("nstate").textContent = playing ? "Brown noise · " + Math.round(S.volume * 100) + "%" : "Paused · tap to wake";
}

/* --- night display: everything black, tiny dim text that wanders (OLED burn-in protection) --- */
let idleT, wanderT;
function wake() { document.body.classList.remove("night"); clearTimeout(idleT); idleT = setTimeout(sleepDisplay, S.dimAfter * 1000); }
function sleepDisplay() { if ($("sheet").classList.contains("open")) return wake(); document.body.classList.add("night"); wander(); }
function wander() {
  const n = $("nightinfo"), w = innerWidth, h = innerHeight;
  n.style.left = Math.round(20 + Math.random() * Math.max(0, w - 200)) + "px";
  n.style.top = Math.round(40 + Math.random() * Math.max(0, h - 160)) + "px";
}
function tick() {
  const d = new Date(), hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
  $("nclock").textContent = S.showClock ? hh + ":" + mm : "";
  // schedule (fires once per day per setting)
  const hm = hh + ":" + mm, day = d.toDateString();
  if (S.autoStart && hm === S.autoStart && S._firedStart !== day) { S._firedStart = day; save(); play("schedule"); }
  if (S.autoStop && hm === S.autoStop && S._firedStop !== day) { S._firedStop = day; save(); pause("schedule"); }
  const m = $("meter"); if (m) m.style.width = Math.min(100, micLevel * 400) + "%";
}

/* --- wake lock --- */
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") { lock = await navigator.wakeLock.request("screen"); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); if (ctx) ctx.resume(); } });

/* ======================= settings form ======================= */
const fmtPct = v => Math.round(v * 100) + "%";
const SCHEMA = [
  { sec: "Sound" },
  { k: "volume", name: "Volume", min: 0, max: 1, step: 0.01, fmt: fmtPct },
  { k: "tone", name: "Tone", min: 150, max: 4000, log: true, fmt: v => Math.round(v) + " Hz", ends: ["Deeper", "Brighter"], hint: "Top of the sound. Lower is darker and more muffled, like a distant waterfall." },
  { k: "rumble", name: "Rumble cut", min: 20, max: 200, log: true, fmt: v => Math.round(v) + " Hz", ends: ["Full rumble", "Tighter"], hint: "Removes bass a small speaker can’t reproduce. Raise it if the Soundcore buzzes or flutters." },
  { k: "color", name: "Colour", min: 0, max: 1, step: 0.01, fmt: v => v < 0.02 ? "Pure brown" : Math.round(v * 100) + "% pink", ends: ["Brown", "Pink"] },
  { k: "width", name: "Stereo width", min: 0, max: 1, step: 0.01, fmt: v => v < 0.02 ? "Mono" : fmtPct(v) },
  { k: "waves", name: "Ocean swell", min: 0, max: 0.6, step: 0.01, fmt: v => v < 0.01 ? "Off" : fmtPct(v / 0.6), hint: "A slow rise and fall in volume, like breathing or waves." },
  { k: "wavePeriod", name: "Swell length", min: 4, max: 30, step: 0.5, fmt: v => v + " s" },
  { k: "fadeIn", name: "Fade in", min: 0, max: 60, step: 1, fmt: v => v + " s" },
  { k: "fadeOut", name: "Fade out", min: 0, max: 30, step: 1, fmt: v => v + " s" },

  { sec: "Intro jingle" },
  { k: "introOn", type: "toggle", name: "Play the jingle when starting" },
  { k: "introVol", name: "Jingle volume", min: 0, max: 1, step: 0.01, fmt: fmtPct },
  { k: "noiseDelay", name: "Noise starts", min: 0, max: 20, step: 0.1, fmt: v => v.toFixed(1) + " s after the jingle starts", hintFn: () => `Your jingle is ${jingleBuf ? jingleBuf.duration.toFixed(1) : "4.4"} s long. Set this shorter to let the noise rise underneath the jingle’s ending, or longer to leave a pause before it.` },
  { type: "buttons", items: [["Preview jingle", previewJingle], ["Jingle → noise", () => { if (playing) pause(); setTimeout(() => play("tap"), playing ? 300 : 0); }]] },

  { sec: "Voice control" },
  { k: "voiceOn", type: "toggle", name: "Listen for the wake word", onchange: v => v ? initVoice().then(() => { if (model && !mic) startMic().then(() => { buildRecognizer(); idleVoicePill(); }); }) : stopVoice() },
  { type: "wake" },
  { k: "minConf", name: "Strictness", min: 0.3, max: 0.95, step: 0.01, fmt: fmtPct, ends: ["Responds easily", "Fewer false wakes"], hint: "How sure the recogniser must be before it accepts the wake word." },
  { k: "duck", name: "Lower noise while listening", min: 0, max: 1, step: 0.01, fmt: v => "to " + fmtPct(v), hint: "After the wake word, the noise dips so your command is easier to hear." },
  { k: "chime", type: "toggle", name: "Soft chime on wake word" },
  { k: "chimeVol", name: "Chime volume", min: 0.02, max: 1, step: 0.01, fmt: fmtPct },
  { k: "micGain", name: "Mic boost", min: 0.5, max: 4, step: 0.1, fmt: v => "×" + v.toFixed(1), onchange: () => { if (micNodes) micNodes.pre.gain.value = S.micGain; } },
  { k: "micFx", type: "toggle", name: "Phone echo/noise cancellation", hint: "Can help on some phones, but on others it switches audio into “call mode” and makes the noise sound thinner. Off is the safer default.", onchange: () => { if (mic) startMic().catch(() => setPill("err", "Microphone blocked")); } },
  { type: "heard" },
  { type: "cmds" },

  { sec: "Schedule" },
  { k: "autoStart", type: "time", name: "Start automatically at", hint: "Plays the jingle then the noise, once a day. Leave blank for off." },
  { k: "autoStop", type: "time", name: "Stop automatically at", hint: "Fades out once a day. Leave blank to play all night." },

  { sec: "Screen" },
  { k: "dimAfter", name: "Go dark after", min: 5, max: 120, step: 5, fmt: v => v + " s", hint: "The screen goes black with a small, slowly wandering clock to protect the S8’s OLED from burn-in. Tap anywhere to bring the controls back. The first tap only wakes the screen." },
  { k: "showClock", type: "toggle", name: "Show clock while dark" },
  { k: "resume", type: "toggle", name: "Resume after a restart", hint: "If the phone or app restarts while the noise is playing (say, after a power cut), the noise comes back on its own, without the jingle." },
  ...(NATIVE ? [{ sec: "Phone" }, { type: "buttons", items: [["Android settings", () => SleepNoiseNative.openSettings()], ["Choose home app", () => SleepNoiseNative.openHomeSettings()]] }] : []),
  { type: "buttons", items: [["Reset all settings", () => { if (confirmReset()) { S = Object.assign({}, DEFAULTS); save(); applySound(); buildRecognizer(); buildForm(); render(); toast("Settings reset"); } }, "warn"]] },
];
let resetArmed = 0;
function confirmReset() { if (Date.now() - resetArmed < 3000) return true; resetArmed = Date.now(); toast("Tap again to reset"); return false; }

const toSlider = (f, v) => f.log ? Math.log(v / f.min) / Math.log(f.max / f.min) : (v - f.min) / (f.max - f.min);
const fromSlider = (f, x) => { let v = f.log ? f.min * Math.pow(f.max / f.min, x) : f.min + x * (f.max - f.min); if (f.step) v = Math.round(v / f.step) * f.step; return +v.toFixed(4); };
let VOCAB = null;
function vocab() { if (!VOCAB) { const el = $("vocab"); VOCAB = new Set(el ? el.textContent.split("\n") : []); } return VOCAB; }

function buildForm() {
  const form = $("form"); form.innerHTML = "";
  for (const f of SCHEMA) {
    if (f.sec) { const d = document.createElement("div"); d.className = "sec"; d.textContent = f.sec; form.appendChild(d); continue; }
    const row = document.createElement("div"); row.className = "row"; form.appendChild(row);
    if (f.type === "toggle") {
      row.innerHTML = `<div class="toggle"><span class="name">${f.name}</span><i class="sw" data-k="${f.k}"></i></div>` + (f.hint ? `<div class="hint">${f.hint}</div>` : "");
      row.querySelector(".toggle").onclick = () => { S[f.k] = !S[f.k]; save(); syncForm(); applySound(); f.onchange && f.onchange(S[f.k]); };
    } else if (f.type === "time") {
      row.innerHTML = `<div class="top"><span class="name">${f.name}</span></div><div class="two"><input type="time" data-k="${f.k}"><button class="btn" style="flex:0 0 auto">Clear</button></div><div class="hint">${f.hint}</div>`;
      const inp = row.querySelector("input"); inp.onchange = () => { S[f.k] = inp.value; save(); };
      row.querySelector("button").onclick = () => { S[f.k] = ""; inp.value = ""; save(); };
    } else if (f.type === "buttons") {
      row.innerHTML = `<div class="btns"></div>`;
      for (const [label, fn, cls] of f.items) { const b = document.createElement("button"); b.className = "btn " + (cls || ""); b.textContent = label; b.onclick = fn; row.firstChild.appendChild(b); }
    } else if (f.type === "wake") {
      row.innerHTML = `<div class="top"><span class="name">Wake word</span></div>
        <select id="wakesel">${WAKE_PRESETS.map(p => `<option>${p}</option>`).join("")}<option value="__custom">Custom…</option></select>
        <input id="wakecustom" type="text" placeholder="e.g. hello moon" style="margin-top:10px;display:none" autocapitalize="off" autocomplete="off">
        <div class="hint" id="wakehint">Two common words work best. Each word must be in the offline dictionary.</div>`;
      const sel = row.querySelector("#wakesel"), cus = row.querySelector("#wakecustom"), hint = row.querySelector("#wakehint");
      const apply = phrase => {
        phrase = phrase.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
        if (!phrase) return;
        const missing = phrase.split(" ").filter(w => !vocab().has(w));
        if (missing.length) { hint.innerHTML = `<span style="color:var(--warn)">Not in the dictionary: ${missing.join(", ")}.</span> Pick different words.`; return; }
        hint.textContent = "Two common words work best. Each word must be in the offline dictionary.";
        S.wake = phrase; save(); buildRecognizer(); idleVoicePill(); renderCmds();
      };
      sel.onchange = () => { if (sel.value === "__custom") { cus.style.display = "block"; cus.focus(); } else { cus.style.display = "none"; apply(sel.value); } };
      cus.onchange = () => apply(cus.value);
    } else if (f.type === "heard") {
      row.innerHTML = `<div class="top"><span class="name">Last heard</span><span class="val">mic level</span></div><div class="heard" id="heard">${lastHeard || "—"}</div><div class="meter"><i id="meter"></i></div>
      <div class="hint">Speak a command to test. Each word shows how confident the recogniser was. If the wake word gets ignored, lower Strictness or raise Mic boost.</div>`;
    } else if (f.type === "cmds") {
      row.innerHTML = `<div class="cmds" id="cmds"></div>`;
    } else {
      row.innerHTML = `<div class="top"><span class="name">${f.name}</span><span class="val"></span></div><input type="range" min="0" max="1000" data-k="${f.k}">` +
        (f.ends ? `<div class="ends"><span>${f.ends[0]}</span><span>${f.ends[1]}</span></div>` : "") +
        (f.hint || f.hintFn ? `<div class="hint">${f.hint || f.hintFn()}</div>` : "");
      const r = row.querySelector("input");
      r.oninput = () => { S[f.k] = fromSlider(f, r.value / 1000); paint(row, f); applySound(); f.onchange && f.onchange(S[f.k]); if (f.k === "volume") render(); };
      r.onchange = save;
    }
  }
  syncForm(); renderCmds();
}
function paint(row, f) { const r = row.querySelector("input[type=range]"); row.querySelector(".val").textContent = f.fmt(S[f.k]); r.style.setProperty("--p", (r.value / 10) + "%"); }
function syncForm() {
  const form = $("form"); if (!form.firstChild) return;
  form.querySelectorAll("input[type=range]").forEach(r => { const f = SCHEMA.find(x => x.k === r.dataset.k); r.value = Math.round(toSlider(f, S[f.k]) * 1000); paint(r.closest(".row"), f); });
  form.querySelectorAll(".sw").forEach(s => s.classList.toggle("on", !!S[s.dataset.k]));
  form.querySelectorAll("input[type=time]").forEach(i => i.value = S[i.dataset.k] || "");
  const sel = $("wakesel"); if (sel) { if (WAKE_PRESETS.includes(S.wake)) sel.value = S.wake; else { sel.value = "__custom"; $("wakecustom").style.display = "block"; $("wakecustom").value = S.wake; } }
}
function renderCmds() {
  const el = $("cmds"); if (!el) return;
  el.innerHTML = `Say <b>“${S.wake}”</b>, wait for the chime, then a command, or say it all in one go (“${S.wake} stop”).<br>` +
    COMMANDS.map(c => `<b>${c.phrases.slice(0, 3).join(" / ")}</b>`).join(" · ");
}

/* ======================= wiring ======================= */
$("big").onclick = toggle;
$("vup").onclick = () => nudgeVolume(+0.05);
$("vdown").onclick = () => nudgeVolume(-0.05);
$("gear").onclick = () => { if (!$("form").firstChild) buildForm(); else syncForm(); $("sheet").classList.add("open"); };
$("close").onclick = () => { $("sheet").classList.remove("open"); wake(); };
// The first touch while dark only wakes the screen, so a sleepy hand can’t pause by accident.
document.addEventListener("pointerdown", e => {
  if (document.body.classList.contains("night")) { e.preventDefault(); e.stopPropagation(); const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener("click", swallow, { capture: true, once: true }); wake(); return; }
  wake();
}, true);

let begun = false;
async function begin() {
  if (begun) return; begun = true;
  $("start").style.display = "none";
  if (!APPMODE) {
    try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
    try { screen.orientation && screen.orientation.lock && await screen.orientation.lock("portrait"); } catch (e) {}
  }
  await initAudio();
  try { await ctx.resume(); } catch (e) {}
  if (ctx.state !== "running") {   // browser insisted on a tap: the next touch anywhere unlocks sound
    toast("Tap once to enable sound");
    document.addEventListener("pointerdown", () => ctx.resume(), { once: true, capture: true });
  }
  keepAwake();
  render(); wake();
  setInterval(tick, 5000); tick();
  setInterval(() => { if (document.body.classList.contains("night")) wander(); }, 60000);
  if (S.resume && S._wasPlaying) { S._wasPlaying = false; play(null, { noIntro: true }); }
  setTimeout(initVoice, 300);
}
$("startbtn").onclick = begin;
if (APPMODE) { $("start").style.display = "none"; setTimeout(begin, 0); }
render();
window.SleepNoise = { get S() { return S; }, play, pause, onResult, get playing() { return playing; }, get ctx() { return ctx; }, get voiceState() { return voiceState; }, get engine() { return engineKind; }, get windowOpen() { return windowOpen; }, get limiter() { return limiter; } };
</script>
